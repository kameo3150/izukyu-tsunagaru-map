name: Dog and Izu weekly audit
on:
  schedule:
    - cron: '0 23 * * 0'
  workflow_dispatch:
  push:
    paths:
      - 'audit-dashboard/audit.py'
      - '.github/workflows/dog-izu-audit.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit pages and links
        run: python audit-dashboard/audit.py
      - name: Save verified audit report
        run: |
          git add audit-dashboard/data/history.json
          if ! git diff --cached --quiet -- audit-dashboard/data/history.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Record weekly Dog and Izu audit'
            git push
          fi
